---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-store
  template:
    metadata:
      labels:
        app: feature-store
    spec:
      containers:
        - name: feature-store
          image: {{.Values.feature_store.image}}
          env:
            - name: REDIS_HOST
              value: redis
            - name: DB_HOST
              value: timescaledb
